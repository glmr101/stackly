<!-- Bottom Sheet Overlay -->

<!-- Inline Script for Interactions -->
<script>
        function toggleDetails(id) {
            const el = document.getElementById(id);
            if(el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                // Optional: animate height
            } else {
                el.classList.add('hidden');
            }
        }

        function openBottomSheet() {
            const sheet = document.getElementById('add-account-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            
            overlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeBottomSheet() {
            const sheet = document.getElementById('add-account-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            
            sheet.classList.add('translate-y-full');
            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300); // match transition duration
        }

        function selectType(btn) {
            // Reset all siblings
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => {
                b.className = 'px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant font-label-md hover:bg-surface-variant transition-colors';
            });
            // Set active
            btn.className = 'px-4 py-2 rounded-full bg-primary/20 text-primary font-label-md transition-colors';
        }

        // Expose open function to the global FAB in the shell if possible, or bind it here.
        // The shell has an add button, let's try to attach to it if it exists
        document.addEventListener('DOMContentLoaded', () => {
             const shellFab = document.querySelector('nav .bg-primary');
             if(shellFab) {
                 shellFab.onclick = openBottomSheet;
             }
        });
    </script>
